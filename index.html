<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Calculator</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/input.css">
    <link rel="stylesheet" href="css/multiplier.css">
    <link rel="stylesheet" href="css/total.css">
    <link rel="stylesheet" href="css/history.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/skeleton.css">
    <link rel="stylesheet" href="css/export.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- Кастомное модальное окно -->
    <div id="customModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-icon">⚠️</div>
            <div class="modal-message" id="modalMessage">Сообщение</div>
            <button class="modal-button" id="modalButton">Ok</button>
        </div>
    </div>

    <!-- Модальное окно редактирования -->
    <div id="editModal" class="modal-overlay" style="display: none;">
        <div class="modal-content edit-modal-content">
            <div class="edit-modal-header">
                <span class="edit-modal-icon">✏️</span>
                <span class="edit-modal-title">Редактировать запись</span>
            </div>
            
            <div class="edit-modal-body">
                <div class="edit-field">
                    <label>Ширина (мм)</label>
                    <input type="text" id="editWidth" inputmode="decimal">
                </div>
                <div class="edit-field">
                    <label>Высота (мм)</label>
                    <input type="text" id="editHeight" inputmode="decimal">
                </div>
                <div class="edit-field">
                    <label>Множитель</label>
                    <input type="text" id="editMultiplier" inputmode="decimal" value="1">
                </div>
                <div class="edit-field">
                    <label>Заметка</label>
                    <textarea id="editNote" rows="2" placeholder="Например: окно кухня, 2 этаж..."></textarea>
                </div>
                
                <div class="edit-preview">
                    <span>Площадь:</span>
                    <span class="edit-preview-value" id="editPreview">0.00 м²</span>
                </div>
            </div>
            
            <div class="edit-modal-actions">
                <button class="edit-btn-cancel" id="editCancelBtn">Отмена</button>
                <button class="edit-btn-save" id="editSaveBtn">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="app">
        <div class="main-layout">
            <!-- ЛЕВАЯ КОЛОНКА -->
            <div class="left-column">
                <!-- Шапка внутри левой колонки -->
                <div class="header">
                    <div class="header-grid">
                        <h1 class="header-title">📐 Инвентаризация</h1>
                        <button class="theme-toggle" id="themeToggle" title="Переключить тему">
                            🌙
                        </button>
                    </div>
                    <div class="subtitle">
                        Ввод в <span>мм</span> Результат в <span>м²</span>
                    </div>
                </div>

                <div class="input-section">
                    <div class="input-row">
                        <div class="input-group">
                            <label>Ширина <small>(мм)</small></label>
                            <input type="text" id="widthInput" inputmode="decimal" placeholder="1000">
                        </div>
                        <div class="input-group">
                            <label>Высота <small>(мм)</small></label>
                            <input type="text" id="heightInput" inputmode="decimal" placeholder="1000">
                        </div>
                    </div>
                    <button class="btn-add" id="addBtn">➕ Добавить</button>
                </div>

                <div class="multiplier-section" id="multiplierSection">
                    <div class="multiplier-header">
                        <span>🔁 Умножить последний</span>
                        <span class="last-item" id="lastItemInfo">—</span>
                    </div>
                    <div class="multiplier-buttons">
                        <button data-mult="2">×2</button>
                        <button data-mult="3">×3</button>
                        <button data-mult="4">×4</button>
                        <button data-mult="5">×5</button>
                        <div class="custom-multiplier">
                            <input type="text" id="customMultInput" inputmode="decimal" placeholder="xN">
                            <button id="applyCustomMult">×</button>
                        </div>
                    </div>
                </div>

                <div class="total-area">
                    <div class="total-area-left">
                        <span>📊 Общая площадь</span>
                        <div class="precision-toggle">
                            <button class="precision-btn active" data-precision="2" title="Округление до сотых">0.00</button>
                            <button class="precision-btn" data-precision="3" title="Округление до тысячных">0.000</button>
                            <button class="precision-btn" data-precision="4" title="Округление до десятитысячных">0.0000</button>
                        </div>
                    </div>
                    <span class="value" id="totalDisplay">0 <small>м²</small></span>
                </div>

                <div class="footer-hint">💡 1 м² = 1 000 000 мм²</div>
            </div>

            <!-- ПРАВАЯ КОЛОНКА -->
            <div class="right-column">
                <div class="history-section">
                    <div class="history-header">
                        <h3>📋 История</h3>
                        <div class="history-controls">
                            <span class="count" id="itemsCount">0</span>
                            <button class="btn-export" id="exportBtn" title="Экспорт данных">📤</button>
                            <button class="btn-import" id="importBtn" title="Импорт данных">📥</button>
                            <button class="btn-clear" id="clearAllBtn" title="Очистить историю">✕</button>
                        </div>
                    </div>
                    
                    <!-- Скелетон загрузки -->
                    <div class="history-skeleton" id="historySkeleton">
                        <div class="skeleton-item">
                            <div class="skeleton-left">
                                <div class="skeleton-line skeleton-line-1"></div>
                                <div class="skeleton-line skeleton-line-2"></div>
                            </div>
                            <div class="skeleton-right">
                                <div class="skeleton-badge"></div>
                            </div>
                        </div>
                        <div class="skeleton-item">
                            <div class="skeleton-left">
                                <div class="skeleton-line skeleton-line-1"></div>
                                <div class="skeleton-line skeleton-line-2"></div>
                            </div>
                            <div class="skeleton-right">
                                <div class="skeleton-badge"></div>
                            </div>
                        </div>
                        <div class="skeleton-item">
                            <div class="skeleton-left">
                                <div class="skeleton-line skeleton-line-1"></div>
                                <div class="skeleton-line skeleton-line-2"></div>
                            </div>
                            <div class="skeleton-right">
                                <div class="skeleton-badge"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Реальный список -->
                    <ul class="history-list" id="historyList" style="display: none;">
                        <li class="empty-state">📭 История пуста</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Скрытый input для импорта -->
    <input type="file" id="importFileInput" accept=".json" style="display: none;">

    <!-- Меню экспорта -->
    <div id="exportMenu" class="modal-overlay" style="display: none;">
        <div class="export-menu-content">
            <div class="export-menu-header">
                <span class="export-menu-icon">📤</span>
                <span class="export-menu-title">Экспорт данных</span>
            </div>
            <div class="export-menu-items">
                <button class="export-menu-item" data-format="csv">
                    <span class="export-item-icon">📊</span>
                    <div class="export-item-info">
                        <div class="export-item-title">Экспорт в CSV</div>
                        <div class="export-item-desc">Открыть в Excel или Google Sheets</div>
                    </div>
                </button>
                <button class="export-menu-item" data-format="json">
                    <span class="export-item-icon">💾</span>
                    <div class="export-item-info">
                        <div class="export-item-title">Экспорт в JSON</div>
                        <div class="export-item-desc">Резервная копия для восстановления</div>
                    </div>
                </button>
            </div>
            <button class="export-menu-cancel" id="exportCancelBtn">Отмена</button>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/precision.js"></script>
    <script src="js/data.js"></script>
    <script src="js/skeleton.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/history.js"></script>
    <script src="js/edit.js"></script>
    <script src="js/input-filter.js"></script>
    <script src="js/export.js"></script>
    <script src="js/main.js"></script>
</body>
